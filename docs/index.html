<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>종목 탐색기</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="종목탐색" />
<style>
  :root{
    --bg: #0B1220;
    --panel: #121B2E;
    --panel-border: #1E2A42;
    --text: #E7ECF5;
    --text-dim: #7C8AA3;
    --accent: #E8A33D;
    --up: #E5484D;
    --down: #3B82F6;
    --purple: #9D8CFF;
    --mono: "SF Mono","JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
    --sans: -apple-system, "SF Pro Text", "Pretendard", "Apple SD Gothic Neo", sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    padding-bottom:50px;
  }
  header{
    padding:20px 18px 14px;
    border-bottom:1px solid var(--panel-border);
    position:sticky; top:0; background:var(--bg); z-index:10;
  }
  .eyebrow{
    font-family:var(--mono); font-size:11px; letter-spacing:0.12em;
    color:var(--accent); text-transform:uppercase;
  }
  h1{ font-size:21px; margin:6px 0 2px; font-weight:700; letter-spacing:-0.01em; }
  .subline{ font-family:var(--mono); font-size:12px; color:var(--text-dim); }

  .history-section{ padding:14px 18px 0; }
  .history-label{
    font-size:13px; font-weight:700; color:var(--accent);
    padding:2px 0 8px;
  }
  .history-date-input{
    width:100%; box-sizing:border-box; background:var(--panel); border:1px solid var(--panel-border);
    border-radius:10px; padding:10px 14px; color:var(--text); font-family:var(--mono); font-size:14px;
    margin-bottom:8px; color-scheme: dark;
  }

  .market-tabs{ display:flex; gap:8px; padding:14px 18px 0; }
  .tab-btn{
    flex:1; text-align:center; padding:10px 0; border-radius:10px;
    font-size:14px; font-weight:700; border:1px solid var(--panel-border);
    color:var(--text-dim); background:var(--panel);
  }
  .tab-btn.active{ color:var(--bg); background:var(--accent); border-color:var(--accent); }

  section.market{ display:none; padding:16px 18px 0; }
  section.market.active{ display:block; }

  .group-title{
    display:flex; align-items:baseline; justify-content:space-between;
    margin:20px 0 10px;
  }
  .group-title h2{ font-size:15px; margin:0; font-weight:700; }
  .group-title span{ font-family:var(--mono); font-size:11px; color:var(--text-dim); }

  .row-list{ display:flex; flex-direction:column; gap:8px; }
  a.row-link{ text-decoration:none; color:inherit; display:block; }
  .row{
    background:var(--panel); border:1px solid var(--panel-border);
    border-radius:12px; padding:11px 14px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .row.overlap3{ border-color:rgba(232,163,61,0.6); background:linear-gradient(180deg, rgba(232,163,61,0.14), rgba(232,163,61,0.03)); }
  .row.overlap2{ border-color:rgba(157,140,255,0.4); }
  .row.risky{ border-color:rgba(229,72,77,0.5); background:linear-gradient(180deg, rgba(229,72,77,0.10), rgba(229,72,77,0.02)); }
  .risky-note{
    font-family:var(--mono); font-size:10.5px; color:var(--text-dim);
    line-height:1.5; margin:6px 0 10px;
  }
  a.row-link:active .row{ filter:brightness(1.15); }
  .row-left{ display:flex; align-items:center; gap:10px; min-width:0; }
  .rank{
    font-family:var(--mono); font-size:11px; color:var(--bg); background:var(--text-dim);
    width:20px; height:20px; border-radius:6px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-weight:700;
  }
  .name-block{ min-width:0; }
  .name{ font-size:14px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .code{ font-family:var(--mono); font-size:10px; color:var(--text-dim); }
  .tags{ display:flex; gap:4px; margin-top:3px; flex-wrap:wrap; }
  .tag{
    font-family:var(--mono); font-size:9px; padding:1px 6px; border-radius:8px;
    background:rgba(157,140,255,0.15); color:var(--purple); white-space:nowrap;
  }
  .row-right{ text-align:right; flex-shrink:0; }
  .metric-main{ font-family:var(--mono); font-size:14px; font-weight:700; }
  .metric-sub{ font-family:var(--mono); font-size:10px; color:var(--text-dim); }
  .live-price{ font-family:var(--mono); font-size:11px; margin-top:2px; }
  .live-price.up{ color:var(--up); }
  .live-price.down{ color:var(--down); }
  .live-price.flat{ color:var(--text-dim); }
  .live-badge{
    display:inline-block; width:5px; height:5px; border-radius:50%;
    background:var(--accent); margin-right:5px; vertical-align:1px;
  }
  .flow-pos{ color:var(--up); }
  .flow-neg{ color:var(--down); }

  .empty{ padding:24px 0; text-align:center; color:var(--text-dim); font-family:var(--mono); font-size:12px; }
  .scanned{ font-family:var(--mono); font-size:11px; color:var(--text-dim); margin-top:2px; }
  .updated{ font-family:var(--mono); font-size:11px; color:var(--text-dim); text-align:center; margin-top:30px; padding:0 18px; }
  .conditions-note{
    font-family:var(--mono); font-size:10.5px; color:var(--text-dim);
    line-height:1.6; padding:14px 18px 0;
  }
</style>
</head>
<body>
<header>
  <div class="eyebrow">Daily Screening &middot; 전일 종가 기준 (장 시작 전 갱신)</div>
  <h1>조건별 종목 탐색기</h1>
  <div class="subline" id="baseDate">불러오는 중...</div>
  <div class="subline" id="staleWarning" style="margin-top:2px; color:#e5484d; display:none;"></div>
  <div class="subline" style="margin-top:2px; color:var(--accent, #e8a33d);">
    ⏱ 전일 종가 기준 → 장 시작(09:00) 동시호가/시가 매수 검토용
  </div>
  <div class="subline" id="liveStatus" style="margin-top:2px;"></div>
</header>

<div class="history-section">
  <div class="history-label">📅 지난 날짜 기록 보기</div>
  <input type="date" id="historyDateInput" class="history-date-input" />
  <div class="row-list" id="historyResult"></div>
</div>

<div class="market-tabs">
  <button class="tab-btn active" id="tab-kospi" onclick="switchTab('kospi')">코스피</button>
  <button class="tab-btn" id="tab-kosdaq" onclick="switchTab('kosdaq')">코스닥</button>
</div>

<div class="conditions-note">
  정배열+2 · MA20상승+1 · MA60상승+1 · RSI 35~50+1 · RSI 상승전환+2 · 이격도 저점→상승+2 ·
  RVOL≥2+2 · 거래대금 증가+1 (합계 12점 만점) · 8점 이상 관심종목 / 10점 이상 매수후보 / 12점 강한 매수후보
</div>

<section class="market active" id="market-kospi"></section>
<section class="market" id="market-kosdaq"></section>

<div class="updated" id="updatedAt"></div>

<script>
let DATA = null;

function switchTab(market) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.market').forEach(s => s.classList.remove('active'));
  document.getElementById('tab-' + market).classList.add('active');
  document.getElementById('market-' + market).classList.add('active');
}

async function load() {
  try {
    const res = await fetch('results.json', { cache: 'no-store' });
    DATA = await res.json();

    document.getElementById('baseDate').textContent =
      formatDate(DATA.actual_data_date ? DATA.actual_data_date.replace(/-/g, '') : DATA.base_date) +
      ' 종가 기준 · 스크리닝 갱신 ' + new Date(DATA.generated_at).toLocaleTimeString('ko-KR');
    document.getElementById('updatedAt').textContent =
      '전체 갱신 시각: ' + new Date(DATA.generated_at).toLocaleString('ko-KR');

    // 매일 아침(장 시작 전) 실행되는 설계상 "전일 종가"가 기준일 것이 정상이라,
    // 하루 차이 정도는 경고하지 않고, 그보다 훨씬 오래된 데이터일 때만(예: 주말 지나 3일 이상 차이) 경고한다.
    const staleEl = document.getElementById('staleWarning');
    if (staleEl && DATA.actual_data_date && DATA.base_date) {
      const actualDateObj = new Date(DATA.actual_data_date);
      const baseDateObj = new Date(
        `${DATA.base_date.slice(0, 4)}-${DATA.base_date.slice(4, 6)}-${DATA.base_date.slice(6, 8)}`
      );
      const dayGap = Math.round((baseDateObj - actualDateObj) / 86400000);
      if (dayGap >= 3) {
        staleEl.style.display = 'block';
        staleEl.textContent =
          `⚠ 데이터가 ${dayGap}일 전(${formatDate(DATA.actual_data_date.replace(/-/g, ''))}) 기준으로 오래됐습니다 (최근 실행이 실패했을 수 있어요)`;
      } else {
        staleEl.style.display = 'none';
      }
    } else if (staleEl) {
      staleEl.style.display = 'none';
    }

    renderMarket('kospi');
    renderMarket('kosdaq');
  } catch (e) {
    document.getElementById('market-kospi').innerHTML =
      '<div class="empty">데이터를 불러오지 못했습니다.<br>results.json 생성 여부를 확인하세요.</div>';
  }
}

function historyRowHtml(item, rank) {
  const tags = (item.matched || [])
    .map((m) => `<span class="tag">${m.label} +${m.points}</span>`)
    .join('');
  const chg = formatChangePct(item.change_pct);
  const cls = item.change_pct > 0 ? 'flow-pos' : item.change_pct < 0 ? 'flow-neg' : '';
  const naverUrl = `https://finance.naver.com/item/main.naver?code=${item.code}`;

  const eval1w = item.eval && item.eval['1w'];
  const eval1m = item.eval && item.eval['1m'];
  const evalPart = (label, ev) => {
    if (!ev || ev.return_pct === undefined || ev.return_pct === null) {
      return `<span class="metric-sub">${label} 평가 대기중</span>`;
    }
    const evCls = ev.return_pct > 0 ? 'flow-pos' : ev.return_pct < 0 ? 'flow-neg' : '';
    const sign = ev.return_pct > 0 ? '+' : '';
    return `<span class="metric-sub">${label} <span class="${evCls}">${sign}${ev.return_pct}%</span></span>`;
  };

  return `
    <a class="row-link" href="${naverUrl}" target="_blank" rel="noopener">
      <div class="row">
        <div class="row-left">
          <div class="rank">${rank}</div>
          <div class="name-block">
            <div class="name">${item.name}</div>
            <div class="code">${item.code} &middot; ${item.score}점</div>
            ${tags ? `<div class="tags">${tags}</div>` : ''}
          </div>
        </div>
        <div class="row-right">
          <div class="metric-main ${cls}" style="font-size:16px;">${chg.text || '-'}</div>
          <div class="metric-sub">그날 등락률</div>
          <div style="margin-top:4px; display:flex; flex-direction:column; gap:1px;">
            ${evalPart('1주 후', eval1w)}
            ${evalPart('1개월 후', eval1m)}
          </div>
        </div>
      </div>
    </a>
  `;
}

let HISTORY_DATA = null;

async function loadHistoryData() {
  if (HISTORY_DATA) return HISTORY_DATA;
  try {
    const res = await fetch('history.json', { cache: 'no-store' });
    HISTORY_DATA = await res.json();
  } catch (e) {
    HISTORY_DATA = { entries: [] };
  }
  return HISTORY_DATA;
}

async function showHistoryForDate(dateStr) {
  const resultEl = document.getElementById('historyResult');
  if (!dateStr) {
    resultEl.innerHTML = '';
    return;
  }
  const key = dateStr.replace(/-/g, '');
  const data = await loadHistoryData();
  const entry = (data.entries || []).find((e) => e.date === key);
  if (!entry) {
    resultEl.innerHTML = `<div class="empty">${formatDate(key)}에는 기록된 픽이 없습니다.</div>`;
    return;
  }
  const kospiList = entry.kospi || [];
  const kosdaqList = entry.kosdaq || [];
  const kospiHtml = kospiList.map((it, i) => historyRowHtml(it, i + 1)).join('');
  const kosdaqHtml = kosdaqList.map((it, i) => historyRowHtml(it, i + 1)).join('');
  resultEl.innerHTML = `
    <div class="group-title"><h2>코스피</h2><span>${kospiList.length}개</span></div>
    ${kospiHtml || '<div class="empty">없음</div>'}
    <div class="group-title"><h2>코스닥</h2><span>${kosdaqList.length}개</span></div>
    ${kosdaqHtml || '<div class="empty">없음</div>'}
  `;
}

document.getElementById('historyDateInput').addEventListener('change', (e) => {
  showHistoryForDate(e.target.value);
});

function formatDate(yyyymmdd) {
  if (!yyyymmdd || yyyymmdd.length !== 8) return yyyymmdd;
  return `${yyyymmdd.slice(0,4)}.${yyyymmdd.slice(4,6)}.${yyyymmdd.slice(6,8)}`;
}

function formatEok(v) {
  return (v / 100000000).toFixed(1) + '억';
}

function formatChangePct(v) {
  if (v === null || v === undefined) return { text: '', cls: '' };
  const sign = v > 0 ? '+' : '';
  const cls = v > 0 ? 'flow-pos' : v < 0 ? 'flow-neg' : '';
  return { text: `${sign}${v}%`, cls };
}

function scoreRowHtml(item, rank, rowExtraClass) {
  const tags = (item.matched || [])
    .map((m) => `<span class="tag">${m.label} +${m.points}</span>`)
    .join('');
  const naverUrl = `https://finance.naver.com/item/main.naver?code=${item.code}`;
  const chg = formatChangePct(item.change_pct);
  const bigCls = item.change_pct > 0 ? 'flow-pos' : item.change_pct < 0 ? 'flow-neg' : '';
  return `
    <a class="row-link" href="${naverUrl}" target="_blank" rel="noopener">
      <div class="row ${rowExtraClass || ''}" data-code="${item.code}">
        <div class="row-left">
          <div class="rank">${rank}</div>
          <div class="name-block">
            <div class="name">${item.name}</div>
            <div class="code">${item.code} &middot; ${item.score}점</div>
            ${tags ? `<div class="tags">${tags}</div>` : ''}
          </div>
        </div>
        <div class="row-right">
          <div class="metric-main ${bigCls}" style="font-size:16px;" data-live-pct="${item.code}">${chg.text || '-'}</div>
          <div class="metric-sub" data-live-time="${item.code}">전일 대비</div>
        </div>
      </div>
    </a>
  `;
}

function renderGroup(containerId, items, emptyMsg, rowExtraClass) {
  const el = document.getElementById(containerId);
  if (!el) return;
  if (!items || items.length === 0) {
    el.innerHTML = `<div class="empty">${emptyMsg}</div>`;
    return;
  }
  el.innerHTML = items.map((it, i) => scoreRowHtml(it, i + 1, rowExtraClass)).join('');
}

function renderMarket(market) {
  const m = DATA[market];
  const container = document.getElementById('market-' + market);
  if (!m) {
    container.innerHTML = '<div class="empty">데이터 없음</div>';
    return;
  }

  const sections = [];
  sections.push(`<div class="scanned">스캔 종목 수: ${m.scanned_count}개</div>`);

  const tierDefs = [
    ['strongbuy', '⭐⭐⭐ 강한 매수 후보 (12점)', m.strong_buy, 'overlap3'],
    ['buycandidate', '⭐⭐ 매수 후보 (10점 이상)', m.buy_candidate, 'overlap3'],
    ['watch', '⭐ 관심종목 (8점 이상)', m.watch, 'overlap2'],
  ];
  for (const [key, title, list] of tierDefs) {
    sections.push(`
      <div class="group-title"><h2>${title}</h2><span>${(list || []).length}개</span></div>
      <div class="row-list" id="${market}-${key}"></div>
    `);
  }

  // 화면 최하단: 점수 등급과 무관하게, 8개 조건 중 2개 이상만 걸려도 보여주는 리스트
  sections.push(`
    <div class="group-title"><h2>8개 조건 중 2개 이상 충족</h2><span>${(m.condition_2plus || []).length}개</span></div>
    <div class="risky-note">점수 등급(관심종목 8점 등)과는 별개로, 몇 점이든 상관없이 조건을 2개 이상 만족하는 종목을 모두 보여줍니다.</div>
    <div class="row-list" id="${market}-condition2plus"></div>
  `);

  container.innerHTML = sections.join('');

  for (const [key, , list, cls] of tierDefs) {
    renderGroup(`${market}-${key}`, list, '없음', cls);
  }
  renderGroup(`${market}-condition2plus`, m.condition_2plus, '없음', '');
}

load();
startLivePriceLoop();

// ----------------------------------------------------------------------------
// 장중 시세 — GitHub Actions가 15분마다 네이버에서 조회해 docs/live.json에 저장하고,
// 이 페이지는 그 파일을 읽기만 한다 (같은 사이트 내 파일이라 CORS 문제 없음).
// ----------------------------------------------------------------------------
const LIVE_REFRESH_MS = 60000;
let liveTimer = null;

async function fetchLivePrices() {
  try {
    const res = await fetch('live.json', { cache: 'no-store' });
    if (!res.ok) return null;
    return await res.json();
  } catch (e) {
    console.warn('[실시간시세] live.json 로드 실패:', e.message);
    return null;
  }
}

function applyLivePrices(liveData) {
  const map = (liveData && liveData.prices) || {};
  const hasAny = Object.keys(map).length > 0;
  document.querySelectorAll('[data-live]').forEach(el => {
    const code = el.getAttribute('data-live');
    const info = map[code];
    if (!info || typeof info.price !== 'number') return;
    const dir = info.change > 0 ? 'up' : info.change < 0 ? 'down' : 'flat';
    const sign = info.change > 0 ? '+' : info.change < 0 ? '-' : '';
    const rate = Math.abs(info.rate ?? 0).toFixed(2);
    el.className = 'live-price ' + dir;
    el.innerHTML = `<span class="live-badge"></span>${info.price.toLocaleString()}원 ${sign}${Math.abs(info.change).toLocaleString()} (${sign}${rate}%)`;
  });

  // 중복(overlap) 리스트의 등락률 슬롯: 실시간 데이터가 오면 전일 대비 → 실시간 값으로 교체
  document.querySelectorAll('[data-live-pct]').forEach(el => {
    const code = el.getAttribute('data-live-pct');
    const info = map[code];
    if (!info || typeof info.rate !== 'number') return;
    const sign = info.change > 0 ? '+' : info.change < 0 ? '-' : '';
    const cls = info.change > 0 ? 'flow-pos' : info.change < 0 ? 'flow-neg' : '';
    el.className = 'metric-main ' + cls;
    el.style.fontSize = '18px';
    el.textContent = `${sign}${Math.abs(info.rate).toFixed(2)}%`;
  });
  document.querySelectorAll('[data-live-time]').forEach(el => {
    const code = el.getAttribute('data-live-time');
    if (map[code]) el.textContent = '실시간';
  });

  const statusEl = document.getElementById('liveStatus');
  if (statusEl) {
    statusEl.textContent = hasAny
      ? '장중 시세(5분 주기) 갱신: ' + new Date(liveData.updated_at).toLocaleTimeString('ko-KR')
      : '장중 시세 데이터가 아직 없습니다 (당일 종가만 표시 중)';
  }
}

async function refreshLivePrices() {
  const liveData = await fetchLivePrices();
  if (liveData) applyLivePrices(liveData);
}

function startLivePriceLoop() {
  const kickoff = async () => {
    if (!DATA) {
      setTimeout(kickoff, 300);
      return;
    }
    await refreshLivePrices();
    liveTimer = setInterval(refreshLivePrices, LIVE_REFRESH_MS);
  };
  kickoff();
}
</script>
</body>
</html>
