<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>종목 탐색기</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="종목탐색" />
<style>
  :root{
    --bg: #0B1220;
    --panel: #121B2E;
    --panel-border: #1E2A42;
    --text: #E7ECF5;
    --text-dim: #7C8AA3;
    --accent: #E8A33D;
    --up: #E5484D;
    --down: #3B82F6;
    --purple: #9D8CFF;
    --mono: "SF Mono","JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
    --sans: -apple-system, "SF Pro Text", "Pretendard", "Apple SD Gothic Neo", sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    padding-bottom:50px;
  }
  header{
    padding:20px 18px 14px;
    border-bottom:1px solid var(--panel-border);
    position:sticky; top:0; background:var(--bg); z-index:10;
  }
  .eyebrow{
    font-family:var(--mono); font-size:11px; letter-spacing:0.12em;
    color:var(--accent); text-transform:uppercase;
  }
  h1{ font-size:21px; margin:6px 0 2px; font-weight:700; letter-spacing:-0.01em; }
  .subline{ font-family:var(--mono); font-size:12px; color:var(--text-dim); }

  .index-section{ padding:14px 18px 0; }
  .index-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .index-card{
    background:var(--panel); border:1px solid var(--panel-border); border-radius:12px;
    padding:14px 14px 10px;
  }
  .index-card .name{ font-size:13px; font-weight:700; color:var(--text-dim); text-align:center; }
  .index-card .value{ font-family:var(--mono); font-size:22px; font-weight:700; margin-top:4px; text-align:center; }
  .index-card .chg{ font-family:var(--mono); font-size:12.5px; margin-top:2px; text-align:center; }
  .index-card .chg .arrow{ font-size:10px; margin-right:2px; }
  .index-card svg{ width:100%; height:46px; margin-top:8px; display:block; }
  .index-card .asof{ font-family:var(--mono); font-size:9.5px; color:var(--text-dim); text-align:right; margin-top:4px; }
  .index-flow{
    display:flex; justify-content:space-between; gap:4px; margin-top:8px;
    font-family:var(--mono); font-size:10px;
  }
  .index-flow .item{ text-align:center; flex:1; }
  .index-flow .item .k{ color:var(--text-dim); }
  .index-flow .item .v{ margin-top:1px; }

  .perf-section{ padding:14px 18px 4px; }
  .perf-title{ font-size:13px; font-weight:700; color:var(--text-dim); margin-bottom:8px; }
  .perf-grid{ display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; }
  .perf-card{
    background:var(--panel); border:1px solid var(--panel-border); border-radius:10px;
    padding:9px 6px; text-align:center;
  }
  .perf-card .label{ font-family:var(--mono); font-size:9px; color:var(--text-dim); }
  .perf-card .value{ font-family:var(--mono); font-size:15px; font-weight:700; margin-top:3px; }
  .perf-card .sub{ font-family:var(--mono); font-size:9px; color:var(--text-dim); margin-top:1px; }

  .market-tabs{ display:flex; gap:8px; padding:14px 18px 0; }
  .tab-btn{
    flex:1; text-align:center; padding:10px 0; border-radius:10px;
    font-size:14px; font-weight:700; border:1px solid var(--panel-border);
    color:var(--text-dim); background:var(--panel);
  }
  .tab-btn.active{ color:var(--bg); background:var(--accent); border-color:var(--accent); }

  section.market{ display:none; padding:16px 18px 0; }
  section.market.active{ display:block; }

  .group-title{
    display:flex; align-items:baseline; justify-content:space-between;
    margin:20px 0 10px;
  }
  .group-title h2{ font-size:15px; margin:0; font-weight:700; }
  .group-title span{ font-family:var(--mono); font-size:11px; color:var(--text-dim); }

  .row-list{ display:flex; flex-direction:column; gap:8px; }
  a.row-link{ text-decoration:none; color:inherit; display:block; }
  .row{
    background:var(--panel); border:1px solid var(--panel-border);
    border-radius:12px; padding:11px 14px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .row.overlap3{ border-color:rgba(232,163,61,0.6); background:linear-gradient(180deg, rgba(232,163,61,0.14), rgba(232,163,61,0.03)); }
  .row.overlap2{ border-color:rgba(157,140,255,0.4); }
  .row.risky{ border-color:rgba(229,72,77,0.5); background:linear-gradient(180deg, rgba(229,72,77,0.10), rgba(229,72,77,0.02)); }
  .risky-note{
    font-family:var(--mono); font-size:10.5px; color:var(--text-dim);
    line-height:1.5; margin:6px 0 10px;
  }
  a.row-link:active .row{ filter:brightness(1.15); }
  .row-left{ display:flex; align-items:center; gap:10px; min-width:0; }
  .rank{
    font-family:var(--mono); font-size:11px; color:var(--bg); background:var(--text-dim);
    width:20px; height:20px; border-radius:6px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-weight:700;
  }
  .name-block{ min-width:0; }
  .name{ font-size:14px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .code{ font-family:var(--mono); font-size:10px; color:var(--text-dim); }
  .tags{ display:flex; gap:4px; margin-top:3px; flex-wrap:wrap; }
  .tag{
    font-family:var(--mono); font-size:9px; padding:1px 6px; border-radius:8px;
    background:rgba(157,140,255,0.15); color:var(--purple); white-space:nowrap;
  }
  .row-right{ text-align:right; flex-shrink:0; }
  .metric-main{ font-family:var(--mono); font-size:14px; font-weight:700; }
  .metric-sub{ font-family:var(--mono); font-size:10px; color:var(--text-dim); }
  .live-price{ font-family:var(--mono); font-size:11px; margin-top:2px; }
  .live-price.up{ color:var(--up); }
  .live-price.down{ color:var(--down); }
  .live-price.flat{ color:var(--text-dim); }
  .live-badge{
    display:inline-block; width:5px; height:5px; border-radius:50%;
    background:var(--accent); margin-right:5px; vertical-align:1px;
  }
  .flow-pos{ color:var(--up); }
  .flow-neg{ color:var(--down); }

  .empty{ padding:24px 0; text-align:center; color:var(--text-dim); font-family:var(--mono); font-size:12px; }
  .scanned{ font-family:var(--mono); font-size:11px; color:var(--text-dim); margin-top:2px; }
  .updated{ font-family:var(--mono); font-size:11px; color:var(--text-dim); text-align:center; margin-top:30px; padding:0 18px; }
  .conditions-note{
    font-family:var(--mono); font-size:10.5px; color:var(--text-dim);
    line-height:1.6; padding:14px 18px 0;
  }
</style>
</head>
<body>
<header>
  <div class="eyebrow">Daily Screening &middot; 전일 종가 기준</div>
  <h1>조건별 종목 탐색기</h1>
  <div class="subline" id="baseDate">불러오는 중...</div>
  <div class="subline" id="liveStatus" style="margin-top:2px;"></div>
</header>

<div class="index-section">
  <div class="index-grid" id="indexGrid">
    <div class="index-card"><div class="name">코스피</div><div class="value" style="color:var(--text-dim)">불러오는 중</div></div>
    <div class="index-card"><div class="name">코스닥</div><div class="value" style="color:var(--text-dim)">불러오는 중</div></div>
  </div>
</div>

<div class="perf-section">
  <div class="perf-title">📈 지난 픽(2개 이상 중복) 사후 성과</div>
  <div class="perf-grid" id="perfGrid">
    <div class="perf-card"><div class="label">불러오는 중</div></div>
  </div>
</div>

<div class="market-tabs">
  <button class="tab-btn active" id="tab-kospi" onclick="switchTab('kospi')">코스피</button>
  <button class="tab-btn" id="tab-kosdaq" onclick="switchTab('kosdaq')">코스닥</button>
</div>

<div class="conditions-note">
  RSI(14)≤30 · 전일 순매수 · 이격도(20일) · 거래대금 · 거래량급증배수 · 정배열(5>20>60일선) 각 상위10 (순매수 제외 5개 지표 기준 중복 표시)
</div>

<section class="market active" id="market-kospi"></section>
<section class="market" id="market-kosdaq"></section>

<div class="updated" id="updatedAt"></div>

<script>
let DATA = null;

function switchTab(market) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.market').forEach(s => s.classList.remove('active'));
  document.getElementById('tab-' + market).classList.add('active');
  document.getElementById('market-' + market).classList.add('active');
}

async function load() {
  try {
    const res = await fetch('results.json', { cache: 'no-store' });
    DATA = await res.json();

    document.getElementById('baseDate').textContent =
      formatDate(DATA.base_date) + ' 기준 · 스크리닝 갱신 ' +
      new Date(DATA.generated_at).toLocaleTimeString('ko-KR');
    document.getElementById('updatedAt').textContent =
      '전체 갱신 시각: ' + new Date(DATA.generated_at).toLocaleString('ko-KR');

    renderMarket('kospi');
    renderMarket('kosdaq');
  } catch (e) {
    document.getElementById('market-kospi').innerHTML =
      '<div class="empty">데이터를 불러오지 못했습니다.<br>results.json 생성 여부를 확인하세요.</div>';
  }

  loadPerformance();
}

async function loadPerformance() {
  const grid = document.getElementById('perfGrid');
  try {
    const res = await fetch('performance_summary.json', { cache: 'no-store' });
    const perf = await res.json();
    const cards = [];
    const labelMap = { kospi: '코스피', kosdaq: '코스닥' };
    const horizonMap = { '1w': '1주 후', '1m': '1개월 후' };
    for (const market of ['kospi', 'kosdaq']) {
      for (const horizon of ['1w', '1m']) {
        const s = (perf[market] || {})[horizon];
        if (!s || s.count === 0) {
          cards.push(`
            <div class="perf-card">
              <div class="label">${labelMap[market]} ${horizonMap[horizon]}</div>
              <div class="value" style="color:var(--text-dim)">-</div>
              <div class="sub">데이터 쌓는 중</div>
            </div>
          `);
        } else {
          const cls = s.avg_return >= 0 ? 'flow-pos' : 'flow-neg';
          const sign = s.avg_return >= 0 ? '+' : '';
          cards.push(`
            <div class="perf-card">
              <div class="label">${labelMap[market]} ${horizonMap[horizon]}</div>
              <div class="value ${cls}">${sign}${s.avg_return}%</div>
              <div class="sub">승률 ${s.win_rate}% (${s.count}건)</div>
            </div>
          `);
        }
      }
    }
    grid.innerHTML = cards.join('');
  } catch (e) {
    grid.innerHTML = '<div class="perf-card"><div class="label">아직 데이터 없음</div></div>';
  }
}

function formatDate(yyyymmdd) {
  if (!yyyymmdd || yyyymmdd.length !== 8) return yyyymmdd;
  return `${yyyymmdd.slice(0,4)}.${yyyymmdd.slice(4,6)}.${yyyymmdd.slice(6,8)}`;
}

function formatShares(v) {
  return (v >= 0 ? '+' : '') + v.toLocaleString() + '주';
}

function formatEok(v) {
  return (v / 100000000).toFixed(1) + '억';
}

const TAG_LABEL = {
  rsi: 'RSI', net_buy: '순매수', disparity: '이격도',
  turnover: '거래대금', volume_surge: '거래량급증', ma_align: '정배열'
};

function formatChangePct(v) {
  if (v === null || v === undefined) return { text: '', cls: '' };
  const sign = v > 0 ? '+' : '';
  const cls = v > 0 ? 'flow-pos' : v < 0 ? 'flow-neg' : '';
  return { text: `${sign}${v}%`, cls };
}

function rowHtml(item, rank, mainLabel, mainValue, mainClass, rowExtraClass) {
  const tags = item.matched_lists
    ? item.matched_lists.map(t => `<span class="tag">${TAG_LABEL[t] || t}</span>`).join('')
    : '';
  const naverUrl = `https://finance.naver.com/item/main.naver?code=${item.code}`;
  const chg = formatChangePct(item.change_pct);
  return `
    <a class="row-link" href="${naverUrl}" target="_blank" rel="noopener">
      <div class="row ${rowExtraClass || ''}" data-code="${item.code}">
        <div class="row-left">
          <div class="rank">${rank}</div>
          <div class="name-block">
            <div class="name">${item.name}</div>
            <div class="code">${item.code}</div>
            ${tags ? `<div class="tags">${tags}</div>` : ''}
          </div>
        </div>
        <div class="row-right">
          <div class="metric-main ${mainClass || ''}">${mainValue}</div>
          <div class="metric-sub">전일종가 ${item.close.toLocaleString()} <span class="${chg.cls}">${chg.text}</span></div>
          <div class="live-price flat" data-live="${item.code}">·</div>
        </div>
      </div>
    </a>
  `;
}

function overlapRowHtml(item, rank, rowExtraClass) {
  const tags = item.matched_lists
    ? item.matched_lists.map(t => `<span class="tag">${TAG_LABEL[t] || t}</span>`).join('')
    : '';
  const naverUrl = `https://finance.naver.com/item/main.naver?code=${item.code}`;
  const chg = formatChangePct(item.change_pct);
  const bigCls = item.change_pct > 0 ? 'flow-pos' : item.change_pct < 0 ? 'flow-neg' : '';
  return `
    <a class="row-link" href="${naverUrl}" target="_blank" rel="noopener">
      <div class="row ${rowExtraClass || ''}" data-code="${item.code}">
        <div class="row-left">
          <div class="rank">${rank}</div>
          <div class="name-block">
            <div class="name">${item.name}</div>
            <div class="code">${item.code}</div>
            ${tags ? `<div class="tags">${tags}</div>` : ''}
          </div>
        </div>
        <div class="row-right">
          <div class="metric-main ${bigCls}" style="font-size:18px;" data-live-pct="${item.code}">${chg.text || '-'}</div>
          <div class="metric-sub" data-live-time="${item.code}">전일 대비</div>
        </div>
      </div>
    </a>
  `;
}

function renderGroup(containerId, items, mainLabelFn, emptyMsg, rowExtraClass, useOverlapStyle) {
  const el = document.getElementById(containerId);
  if (!el) return;
  if (!items || items.length === 0) {
    el.innerHTML = `<div class="empty">${emptyMsg}</div>`;
    return;
  }
  el.innerHTML = useOverlapStyle
    ? items.map((it, i) => overlapRowHtml(it, i + 1, rowExtraClass)).join('')
    : items.map((it, i) => rowHtml(it, i + 1, ...mainLabelFn(it), rowExtraClass)).join('');
}

function renderMarket(market) {
  const m = DATA[market];
  const container = document.getElementById('market-' + market);
  if (!m) {
    container.innerHTML = '<div class="empty">데이터 없음</div>';
    return;
  }

  const sections = [];
  sections.push(`<div class="scanned">스캔 종목 수: ${m.scanned_count}개</div>`);

  if (m.overlap_3plus && m.overlap_3plus.length > 0) {
    sections.push(`
      <div class="group-title"><h2>⭐⭐ 5개 지표 중 3개 이상 중복</h2><span>${m.overlap_3plus.length}개</span></div>
      <div class="row-list" id="${market}-overlap3"></div>
    `);
  }
  if (m.overlap_2plus && m.overlap_2plus.length > 0) {
    sections.push(`
      <div class="group-title"><h2>⭐ 5개 지표 중 2개 이상 중복</h2><span>${m.overlap_2plus.length}개</span></div>
      <div class="row-list" id="${market}-overlap2"></div>
    `);
  }

  const groupDefs = [
    ['rsi', 'RSI 30 이하 (과매도)', m.rsi_low],
    // 아래 5개는 화면에서 숨김 처리 (요청에 따라). 중복 판정 계산에는 계속 사용됨.
    // ['netbuy', '전일 순매수 상위 10', m.net_buy_top],
    // ['disparity', '이격도 하위 10', m.disparity_low],
    // ['turnover', '거래대금 상위 10', m.turnover_top],
    // ['volsurge', '거래량 급증배수 상위 10', m.volume_surge_top],
    // ['maalign', '정배열(5>20>60일선) 상위 10', m.ma_align_top],
  ];
  for (const [key, title, list] of groupDefs) {
    sections.push(`
      <div class="group-title"><h2>${title}</h2><span>${(list || []).length}개</span></div>
      <div class="row-list" id="${market}-${key}"></div>
    `);
  }

  // 화면 최하단: 2개 이상 중복이지만 "방향 구분이 안 되는 지표 조합"이라 하락 가능성도 있는 종목들
  if (m.risky_2plus && m.risky_2plus.length > 0) {
    sections.push(`
      <div class="group-title"><h2>⚠️ 2개 이상 중복이지만 하락 주의</h2><span>${m.risky_2plus.length}개</span></div>
      <div class="risky-note">이격도+거래량급증 / 거래대금+거래량급증 / 이격도+RSI 조합은 급락 당일에도 걸릴 수 있어 별도 표시합니다.</div>
      <div class="row-list" id="${market}-risky"></div>
    `);
  }

  container.innerHTML = sections.join('');

  if (m.overlap_3plus && m.overlap_3plus.length > 0) {
    renderGroup(`${market}-overlap3`, m.overlap_3plus, null, '없음', 'overlap3', true);
  }
  if (m.overlap_2plus && m.overlap_2plus.length > 0) {
    renderGroup(`${market}-overlap2`, m.overlap_2plus, null, '없음', 'overlap2', true);
  }
  if (m.risky_2plus && m.risky_2plus.length > 0) {
    renderGroup(`${market}-risky`, m.risky_2plus, null, '없음', 'risky', true);
  }
  renderGroup(`${market}-rsi`, m.rsi_low, (it) => [`RSI ${it.rsi}`, ''], '조건을 만족하는 종목이 없습니다.');
  // 아래 5개는 화면에서 숨긴 리스트라 렌더링도 생략 (컨테이너 자체가 없음)
  // renderGroup(`${market}-netbuy`, m.net_buy_top, ...);
  // renderGroup(`${market}-disparity`, m.disparity_low, ...);
  // renderGroup(`${market}-turnover`, m.turnover_top, ...);
  // renderGroup(`${market}-volsurge`, m.volume_surge_top, ...);
  // renderGroup(`${market}-maalign`, m.ma_align_top, ...);
}

function buildAreaChart(history, currentChange) {
  if (!history || history.length < 2) return '';
  const values = history.map(h => h.value);
  const lastValue = values[values.length - 1];
  const baseline = lastValue - (currentChange ?? 0); // 전일 종가(기준선) 역산

  const allForRange = values.concat([baseline]);
  const min = Math.min(...allForRange);
  const max = Math.max(...allForRange);
  const range = (max - min) || 1;
  const w = 300, h = 46, pad = 3;
  const stepX = (w - pad * 2) / (values.length - 1);

  const toY = (v) => pad + (h - pad * 2) * (1 - (v - min) / range);
  const baselineY = toY(baseline);

  const points = values.map((v, i) => ({ x: pad + i * stepX, y: toY(v) }));

  const redY = points.map(p => Math.min(p.y, baselineY));
  const blueY = points.map(p => Math.max(p.y, baselineY));

  const areaPath = (ys) => {
    const top = points.map((p, i) => `${p.x.toFixed(1)},${ys[i].toFixed(1)}`).join(' L ');
    const first = points[0].x.toFixed(1);
    const last = points[points.length - 1].x.toFixed(1);
    return `M ${first},${baselineY.toFixed(1)} L ${top} L ${last},${baselineY.toFixed(1)} Z`;
  };
  const linePath = (ys) => points.map((p, i) => `${p.x.toFixed(1)},${ys[i].toFixed(1)}`).join(' ');

  return `
    <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      <line x1="${pad}" y1="${baselineY.toFixed(1)}" x2="${w - pad}" y2="${baselineY.toFixed(1)}"
            stroke="var(--text-dim)" stroke-width="1" stroke-dasharray="2,2" opacity="0.5" />
      <path d="${areaPath(redY)}" fill="var(--up)" opacity="0.16" />
      <path d="${areaPath(blueY)}" fill="var(--down)" opacity="0.16" />
      <polyline points="${linePath(redY)}" fill="none" stroke="var(--up)" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" />
      <polyline points="${linePath(blueY)}" fill="none" stroke="var(--down)" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" />
    </svg>
  `;
}

function renderIndices(indices) {
  const grid = document.getElementById('indexGrid');
  if (!indices) return;
  const labelMap = { KOSPI: '코스피', KOSDAQ: '코스닥' };
  const cards = ['KOSPI', 'KOSDAQ'].map(key => {
    const idx = indices[key];
    if (!idx || typeof idx.value !== 'number') {
      return `<div class="index-card"><div class="name">${labelMap[key]}</div><div class="value" style="color:var(--text-dim)">데이터 없음</div></div>`;
    }
    const isUp = idx.change > 0;
    const isDown = idx.change < 0;
    const cls = isUp ? 'flow-pos' : isDown ? 'flow-neg' : '';
    const arrow = isUp ? '▲' : isDown ? '▼' : '-';
    const sign = isUp ? '+' : '';
    const rate = Math.abs(idx.rate ?? 0).toFixed(2);
    const chart = buildAreaChart(idx.history, idx.change);
    const lastTime = idx.history && idx.history.length ? idx.history[idx.history.length - 1].time : '';
    const flow = idx.flow;
    const flowHtml = flow ? `
      <div class="index-flow">
        ${flowItem('외인', flow.foreign)}
        ${flowItem('기관', flow.institution)}
        ${flowItem('개인', flow.personal)}
      </div>
    ` : '';
    return `
      <div class="index-card">
        <div class="name">${labelMap[key]}</div>
        <div class="value">${idx.value.toLocaleString()}</div>
        <div class="chg ${cls}"><span class="arrow">${arrow}</span>${Math.abs(idx.change).toLocaleString()} ${sign}${rate}%</div>
        ${chart}
        ${flowHtml}
        <div class="asof">${lastTime} 장중</div>
      </div>
    `;
  });
  grid.innerHTML = cards.join('');
}

function flowItem(label, amountEok) {
  if (amountEok === null || amountEok === undefined) {
    return `<div class="item"><div class="k">${label}</div><div class="v" style="color:var(--text-dim)">-</div></div>`;
  }
  const cls = amountEok > 0 ? 'flow-pos' : amountEok < 0 ? 'flow-neg' : '';
  const sign = amountEok > 0 ? '+' : '';
  return `<div class="item"><div class="k">${label}</div><div class="v ${cls}">${sign}${amountEok.toLocaleString()}</div></div>`;
}

load();
startLivePriceLoop();

// ----------------------------------------------------------------------------
// 장중 시세 — GitHub Actions가 15분마다 네이버에서 조회해 docs/live.json에 저장하고,
// 이 페이지는 그 파일을 읽기만 한다 (같은 사이트 내 파일이라 CORS 문제 없음).
// ----------------------------------------------------------------------------
const LIVE_REFRESH_MS = 60000;
let liveTimer = null;

async function fetchLivePrices() {
  try {
    const res = await fetch('live.json', { cache: 'no-store' });
    if (!res.ok) return null;
    return await res.json();
  } catch (e) {
    console.warn('[실시간시세] live.json 로드 실패:', e.message);
    return null;
  }
}

function applyLivePrices(liveData) {
  const map = (liveData && liveData.prices) || {};
  const hasAny = Object.keys(map).length > 0;
  document.querySelectorAll('[data-live]').forEach(el => {
    const code = el.getAttribute('data-live');
    const info = map[code];
    if (!info || typeof info.price !== 'number') return;
    const dir = info.change > 0 ? 'up' : info.change < 0 ? 'down' : 'flat';
    const sign = info.change > 0 ? '+' : info.change < 0 ? '-' : '';
    const rate = Math.abs(info.rate ?? 0).toFixed(2);
    el.className = 'live-price ' + dir;
    el.innerHTML = `<span class="live-badge"></span>${info.price.toLocaleString()}원 ${sign}${Math.abs(info.change).toLocaleString()} (${sign}${rate}%)`;
  });

  // 중복(overlap) 리스트의 등락률 슬롯: 실시간 데이터가 오면 전일 대비 → 실시간 값으로 교체
  document.querySelectorAll('[data-live-pct]').forEach(el => {
    const code = el.getAttribute('data-live-pct');
    const info = map[code];
    if (!info || typeof info.rate !== 'number') return;
    const sign = info.change > 0 ? '+' : info.change < 0 ? '-' : '';
    const cls = info.change > 0 ? 'flow-pos' : info.change < 0 ? 'flow-neg' : '';
    el.className = 'metric-main ' + cls;
    el.style.fontSize = '18px';
    el.textContent = `${sign}${Math.abs(info.rate).toFixed(2)}%`;
  });
  document.querySelectorAll('[data-live-time]').forEach(el => {
    const code = el.getAttribute('data-live-time');
    if (map[code]) el.textContent = '실시간';
  });

  renderIndices(liveData && liveData.indices);

  const statusEl = document.getElementById('liveStatus');
  if (statusEl) {
    statusEl.textContent = hasAny
      ? '장중 시세(5분 주기) 갱신: ' + new Date(liveData.updated_at).toLocaleTimeString('ko-KR')
      : '장중 시세 데이터가 아직 없습니다 (전일 종가만 표시 중)';
  }
}

async function refreshLivePrices() {
  const liveData = await fetchLivePrices();
  if (liveData) applyLivePrices(liveData);
}

function startLivePriceLoop() {
  const kickoff = async () => {
    if (!DATA) {
      setTimeout(kickoff, 300);
      return;
    }
    await refreshLivePrices();
    liveTimer = setInterval(refreshLivePrices, LIVE_REFRESH_MS);
  };
  kickoff();
}
</script>

</html>
